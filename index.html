<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文定之喜｜葉政宣 & 翁千矞</title>
  <meta name="description" content="黑道兄的女兒出嫁囉！邀請您來呷奔！">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+Telugu:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=20261020_5">
</head>

<body>
  <!-- 背景音樂播放器容器（YouTube IFrame） -->
  <div id="youtubePlayerContainer" class="youtube-player-hidden" aria-hidden="true">
    <div id="ytPlayer"></div>
  </div>

  <!-- 懸浮音樂開關按鈕（預設開啟） -->
  <button type="button" class="floating-music-btn is-playing" id="musicToggleBtn" aria-label="切換背景音樂播放">
    <span class="disc-icon spinning" id="musicDiscIcon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none" />
        <circle cx="12" cy="12" r="3" fill="currentColor" />
        <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-dasharray="2 2" fill="none" />
      </svg>
    </span>
    <span class="music-label" id="musicLabel">音樂：開</span>
  </button>

  <main class="page-container">

    <!-- 1. 主視覺海報區塊 -->
    <header class="hero-section">
      <h1 class="sr-only">文定之喜｜葉政宣 & 翁千矞 邀您呷奔</h1>
      <div class="poster-card">
        <img src="./assets/hero_photo.png" alt="文定之喜 葉政宣 & 翁千矞 邀您呷奔" class="hero-image" id="heroImage">
      </div>
    </header>

    <!-- 2. 撕曆卡片區塊（Calendar） -->
    <section class="section-block calendar-section" aria-label="農曆黃曆開席時段">
      <div class="calendar-card">
        <img src="./assets/calendar.png" alt="2026年12月6日 歲次丙午年 文定開席黃曆" class="calendar-image">
      </div>
      <a href="tel:0932528373" class="solid-green-pill-btn calendar-contact-btn">聯繫黑道兄</a>
    </section>

    <!-- 3. 倒數計時區塊 -->
    <section class="section-block countdown-section" aria-label="婚禮倒數計時">
      <div class="retro-badge-wrapper">
        <svg class="badge-border-svg" viewBox="0 0 160 48" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 12 2 L 148 2 L 148 14 L 158 14 L 158 34 L 148 34 L 148 46 L 12 46 L 12 34 L 2 34 L 2 14 L 12 14 Z"
            fill="none" stroke="#036242" stroke-width="2.5" stroke-linejoin="miter" />
        </svg>
        <span class="badge-title">倒數計時</span>
      </div>

      <div class="countdown-green-card">
        <div class="countdown-units-grid">
          <div class="count-unit">
            <span class="count-val" id="daysVal">00</span>
            <span class="count-lbl">天</span>
          </div>
          <div class="count-unit">
            <span class="count-val" id="hoursVal">00</span>
            <span class="count-lbl">時</span>
          </div>
          <div class="count-unit">
            <span class="count-val" id="minutesVal">00</span>
            <span class="count-lbl">分</span>
          </div>
        </div>
      </div>
      <button type="button" class="solid-green-pill-btn" id="calendarBtn">加入行事曆</button>
    </section>

    <!-- 4. 交通資訊區塊 -->
    <section class="section-block traffic-section" aria-label="交通與宴會資訊">
      <div class="retro-badge-wrapper">
        <svg class="badge-border-svg" viewBox="0 0 160 48" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 12 2 L 148 2 L 148 14 L 158 14 L 158 34 L 148 34 L 148 46 L 12 46 L 12 34 L 2 34 L 2 14 L 12 14 Z"
            fill="none" stroke="#036242" stroke-width="2.5" stroke-linejoin="miter" />
        </svg>
        <span class="badge-title">交通資訊</span>
      </div>

      <h2 class="traffic-red-sub">來來龍鳳城 交通指引</h2>

      <div class="info-cards-grid">
        <article class="info-card-vintage">
          <h3 class="card-title">宴會地點</h3>
          <p class="card-desc" id="venueName">來來龍鳳城</p>
          <p class="card-sub" id="venueAddress">苗栗縣竹南鎮龍江街 103 之 1 號</p>
        </article>
        <article class="info-card-vintage">
          <h3 class="card-title">大眾運輸</h3>
          <p class="card-desc" id="transitDesc">台鐵竹南火車站</p>
          <p class="card-sub">轉乘計程車約 10 分鐘</p>
        </article>
        <article class="info-card-vintage">
          <h3 class="card-title">自行開車</h3>
          <p class="card-desc" id="parkingDesc">附設專用停車場</p>
          <p class="card-sub">台 61 線西濱快速公路旁</p>
        </article>
      </div>

      <button type="button" class="solid-green-pill-btn" id="mapsBtn">Google 地圖</button>
    </section>

    <!-- 5. 賓客出席調查表單區塊 -->
    <section class="section-block rsvp-section" aria-label="賓客出席意願調查">
      <div class="retro-badge-wrapper">
        <svg class="badge-border-svg" viewBox="0 0 160 48" preserveAspectRatio="none" aria-hidden="true">
          <path d="M 12 2 L 148 2 L 148 14 L 158 14 L 158 34 L 148 34 L 148 46 L 12 46 L 12 34 L 2 34 L 2 14 L 12 14 Z"
            fill="none" stroke="#036242" stroke-width="2.5" stroke-linejoin="miter" />
        </svg>
        <span class="badge-title">賓客出席</span>
      </div>

      <div class="deadline-block">
        <p>請於 2026/11/16 前填寫完畢</p>
        <p>方便黑道兄統計桌數及餐點</p>
      </div>

      <form class="rsvp-form-container" id="rsvpForm" novalidate>

        <!-- 綠色卡片本體：姓名、電話、出席、人數、餐點 -->
        <div class="rsvp-green-card">
          <div class="form-row-two-col">
            <div class="form-group">
              <label for="guestName">賓客姓名</label>
              <input type="text" id="guestName" name="guestName" placeholder="輸入真實姓名" required autocomplete="name">
            </div>
            <div class="form-group">
              <label for="guestPhone">聯絡電話</label>
              <input type="tel" id="guestPhone" name="guestPhone" placeholder="例：0912345678" required
                autocomplete="tel">
            </div>
          </div>

          <!-- 是否出席 -->
          <fieldset class="attendance-fieldset">
            <legend class="fieldset-legend">是否出席宴席？</legend>
            <div class="radio-pill-group">
              <label class="radio-pill-item">
                <input type="radio" name="attendanceStatus" value="attend" checked>
                <span class="pill-btn">準時出席</span>
              </label>
              <label class="radio-pill-item">
                <input type="radio" name="attendanceStatus" value="decline">
                <span class="pill-btn">祝福滿滿心意到</span>
              </label>
            </div>
          </fieldset>

          <!-- 人數與餐點 -->
          <div class="attendee-details-container" id="attendeeDetails">
            <div class="form-row-two-col">
              <div class="form-group">
                <label for="adultCount">大人人數</label>
                <input type="number" id="adultCount" name="adultCount" min="1" max="10" value="1" required>
              </div>
              <div class="form-group">
                <label for="childCount">兒童人數 (需餐椅)</label>
                <input type="number" id="childCount" name="childCount" min="0" max="5" value="0">
              </div>
            </div>

            <div class="form-row-two-col">
              <div class="form-group">
                <label for="meatCount">葷食數量</label>
                <input type="number" id="meatCount" name="meatCount" min="0" max="10" value="1" required>
              </div>
              <div class="form-group">
                <label for="vegCount">素食數量</label>
                <input type="number" id="vegCount" name="vegCount" min="0" max="10" value="0">
              </div>
            </div>
          </div>
        </div>

        <!-- 給新人的祝福話語 -->
        <div class="message-section-block">
          <label for="blessingMsg" class="block-red-title">給新人的祝福話語</label>
          <div class="green-textarea-wrapper">
            <textarea id="blessingMsg" name="blessingMsg" rows="3" placeholder="留下您對新人的祝福話語"></textarea>
          </div>
        </div>

        <!-- 備註欄 -->
        <div class="message-section-block">
          <label for="remarks" class="block-red-title">備註欄</label>
          <div class="green-textarea-wrapper">
            <textarea id="remarks" name="remarks" rows="3" placeholder="例：若有需要嬰兒椅／素食請再次填寫"></textarea>
          </div>
        </div>

        <!-- 確認送出按鈕 -->
        <div class="form-submit-container">
          <button type="submit" class="solid-green-pill-btn submit-btn" id="submitBtn">
            確認填寫，送出！
          </button>
        </div>

        <!-- 狀態回饋訊息 -->
        <div class="form-feedback" id="formFeedback" role="alert" aria-live="polite"></div>
      </form>
    </section>

    <!-- 6. 頁尾署名區塊 -->
    <footer class="footer-section">
      <h2 class="closing-title">葉政宣 & 翁千矞 文定之喜</h2>
      <div class="closing-note-box">
        <p>誠摯邀請您一起來呷奔</p>
        <p>期待在現場看到大家一同分享我們的喜悅！</p>
      </div>
      <p class="copyright-text">
        © 2026 葉政宣 & 翁千矞 · Web design by 黑道兄的女兒^_^
      </p>
    </footer>

  </main>

  <script src="./script.js?v=20261020_5"></script>
</body>

</html>
